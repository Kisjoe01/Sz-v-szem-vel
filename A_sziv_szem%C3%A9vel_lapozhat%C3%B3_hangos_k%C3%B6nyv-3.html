<!doctype html>

<title>A szív szemével – lapozható hangos könyv</title>
<style>
:root{--paper:#fffdf8;--ink:#29231d;--accent:#6e4b32;--bg:#efe9df}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#d9d0c3,#f5f0e8 45%,#d8cec0);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.app{max-width:980px;margin:auto;padding:12px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:14px;padding:10px;box-shadow:0 4px 18px #0002;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;cursor:pointer}
button:focus{outline:3px solid #111;outline-offset:2px}
#status{font-family:system-ui,sans-serif;font-size:14px;min-width:110px;text-align:center}
.book-wrap{perspective:1800px;margin:18px auto;max-width:850px}
.book{position:relative;min-height:78vh;transform-style:preserve-3d}
.page{background:var(--paper);border-radius:5px 16px 16px 5px;box-shadow:8px 12px 28px #0003, inset 12px 0 20px #0000000d;padding:42px clamp(24px,7vw,72px);min-height:78vh;display:none;overflow:auto;position:relative}
.page.active{display:block;animation:turn .45s ease}
@keyframes turn{from{transform:rotateY(-12deg);opacity:.35}to{transform:rotateY(0);opacity:1}}
.page:after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,#0002,transparent);border-radius:5px 0 0 5px}
.page h1{text-align:center;font-size:clamp(28px,5vw,48px);margin:18vh 0 18px}
.page h2{text-align:center;font-size:clamp(20px,3vw,30px);margin:8px 0 28px;color:var(--accent)}
.page p{font-size:clamp(17px,2.1vw,22px);line-height:1.75;margin:0 0 1em;text-align:justify}
.num{text-align:center;font:14px system-ui,sans-serif;color:#756a5e;position:absolute;bottom:14px;left:0;right:0}
.cover{background:linear-gradient(145deg,#4b3428,#8b674b);color:#fffdf8;text-align:center}
.cover h1{font-size:clamp(36px,7vw,68px);letter-spacing:.03em}
.cover h2{color:#fff0d8}
.cover p{font-family:system-ui,sans-serif;text-align:center}
.help{font:14px system-ui,sans-serif;text-align:center;color:#544b42;margin:10px}
@media(max-width:600px){.page{padding:30px 22px;min-height:75vh}.page p{text-align:left}.toolbar{position:relative}}
</style>
</head>
<body>
<div class="app">
<div class="toolbar" aria-label="Könyvvezérlők">

<button onclick="speakPage()" aria-label="Az oldal felolvasása">🔊 Felolvasás</button>
<button onclick="stopSpeak()" aria-label="Felolvasás leállítása">⏹ Leállítás</button>
<button onclick="toggleAuto()" id="autoBtn" aria-label="Automatikus felolvasás ki-be">▶ Automatikus</button>
<span id="status" aria-live="polite">1. oldal</span>
</div>
<div class="help">Telefonon balra/jobbra húzva vagy a gombokkal lapozhatsz. A felolvasás a telefon magyar hangját használja.</div>
<div class="book-wrap">
<div class="book" id="book"></div>
</div>

<script>
const pages = [{"n": 1, "items": [["p", "A SZÍV SZEMÉVEL\nRoland és Viktória története\nEredeti kézirat és folytatás\nA szív szemével\nEgy koranyári délután hazafelé tartottam, amikor váratlanul megszólított egy idegen nő. Az arca tele volt aggodalommal, és elmondta, hogy a lánya nemrég veszítette el a látását. Azt mondta, látja rajtam, hogy – akárcsak ő – én is látássérült vagyok, de mintha már magabiztosabban és tapasztaltabban kezelném ezt a helyzetet. Megkért, hogy meséljek neki az utamról, bízva abban, hogy talán lehetségesek, és adhatok némi reményt és erőt számára és a lányának. Ahogy beszélgettünk, éreztem, hogy a szavaim új lendületet adnak neki.\nA lánya eddig nem nagyon boldogult, és a segítséget sem nagyon fogadta el. A hozzátartozó azonban úgy vélte, hogy én reményt adhatok neki, hiszen ezt a kört már én lefutottam. Telt-múlt az idő, és elérkezett az a nap, amikor találkoztunk. Bevallom, kicsit izgultam, mert ilyen téren nem volt sok tapasztalatom.\nBemutatkoztam neki: Orsovai Roland vagyok. Ő is kezet nyújtott, és elmondta, hogy Klingszman Viktóriának hívják. Pár perc csend után leültem nem messze egy székre, amit a botommal találtam meg. Az anyukája megkérdezte, hogy kérnék-e valamit inni. Mivel szeretem a kávét, azt kértem.\nKicsit félénken, de tudatosan elkezdtem vele beszélgetni. Kiderült, hogy ő hat évvel fiatalabb nálam, de a hangja alapján úgy tűnt, sokkal jobban izgul, mint én. Nem tudtam, hogy hogyan kérdezzek rá, mi történt a szemével, de végül óvatosan rákérdeztem. Elmondta, hogy gyerekkora óta rossz volt a szeme, de akkor még szemüveggel orvosolható volt. Azonban sajnos cukorbeteg lett, és ez tovább rontott a látásán, míg végül szinte teljesen elvesztette."]]}, {"n": 2, "items": [["p", "Én is meséltem neki, hogy egyik pillanatról a másikra vesztettem el a látásom. Közben megérkezett a kávé, amit nagy szeretettel szolgáltak fel. Az anyukája megkérdezte, hogy tegye-e a kezembe a csészét, vagy megtalálom az asztalon. Mondtam, hogy nyugodtan tegye az asztalra, és kíváncsi voltam, vajon megkérdezi-e, hogyan csinálom.\nAhogy teltek a hetek, Viktória egyre magabiztosabb lett a fehér bottal való közlekedésben. Minden egyes alkalommal, amikor találkoztunk, valami új dolgot tanítottam neki: hogyan érzékelje a járda szélét, hogyan figyelje a hangokat, vagy épp hogyan használja a botot a tömegben. Volt, hogy nevetve botladoztunk végig egy zsúfolt utcán, amikor a bottal majdnem nekimentünk valakinek, de sikerült megúszni egy vicces bocsánatkéréssel.\nEgyik nap úgy döntöttünk, kipróbáljuk, milyen együtt bevásárolni. Ez a program tele volt kihívásokkal, de annál több nevetéssel. Miközben az áruházban kóboroltunk, és megpróbáltunk eligazodni a sorok között, sokszor eltévedtünk, de Viktória mindig pozitívan állt hozzá. \"Hát, ha már látni nem látok, legalább megnevettetem a bolti dolgozókat\" – mondta nevetve, amikor véletlenül a pékáruk helyett a tisztítószerekhez mentünk.\nAz apró sikerek, mint amikor sikerült egyedül választania gyümölcsöt, mindig nagy örömöt hoztak neki, és nekem is. Ahogy egyre magabiztosabbá vált, én is egyre inkább csodáltam az erejét és kitartását. Ez az időszak közelebb hozott minket egymáshoz, és már nemcsak barátként tekintettem rá. Volt valami különleges abban, ahogy minden nehézség közepette is képes volt nevetni és vidám maradni."]]}, {"n": 3, "items": [["p", "Egy különleges napra is emlékszem, amikor egy parkban sétáltunk. Ez volt az első alkalom, hogy teljesen egyedül, segítség nélkül használta a botját. Először kissé tétován indult, de aztán egyre magabiztosabbá vált. Amikor leültünk egy padra, és elmesélte, hogy mennyire fél attól, hogy sosem lesz önálló, valahogy természetesnek tűnt, hogy megfogjam a kezét. Egy pillanatra mindketten elhallgattunk, és abban a csendben éreztem, hogy ez a kapcsolat több, mint egy egyszerű barátság.\nA beszélgetéseink is egyre mélyebbek lettek. Nemcsak a látás elvesztéséről beszéltünk, hanem arról is, hogy mit szeretnénk az élettől, milyen álmaink vannak. A nevetés és a kihívások mellett ezek a meghitt pillanatok hoztak minket egyre közelebb egymáshoz. Szép lassan, észrevétlenül alakult ki köztünk valami mélyebb: a szeretet és a vonzalom.\nEgy nap, amikor már sokadszor találkoztunk, és újra nevetve sétáltunk hazafelé egy hosszú nap után, éreztem, hogy valami változott. Viktória rám nézett, és azt mondta: \"Köszönöm, hogy itt vagy nekem. Azt hiszem, nélküled elvesznék.\" Én csak mosolyogtam, és ekkor mindketten tudtuk, hogy valami különleges született köztünk.\nEz volt az a pillanat, amikor mindketten megértettük, hogy ez már nem csak barátság. Ez annál sokkal több volt. Ahogy mélyült a kapcsolatunk, természetesen megérkeztek az első viták is. Egyik nap, amikor már hetek óta együtt voltunk, egy apróságon kezdtünk el vitatkozni. Viktória úgy érezte, hogy túlságosan irányítani próbálom, míg én csak segíteni akartam neki a mindennapokban. Az érzelmek felforrtak, és egyikünk sem tudta igazán, hogyan kezelje a helyzetet.\n„Nem értem, miért kell mindig megmondanod, mit csináljak!” – mondta feszülten. Én pedig értetlenül álltam előtte, mert csak jót akartam neki."]]}, {"n": 4, "items": [["p", "„Én csak segíteni szeretnék, mert aggódom érted!” – válaszoltam.\nEz a vita mélyebbre vezetett, mint gondoltuk. Viktória egyre inkább frusztrált lett, mert úgy érezte, hogy még mindig nem tud teljesen önállóan boldogulni, és én pedig állandóan emlékeztettem erre. Egy ponton meggondolatlanul kimondtam: „Talán jobb lenne, ha egyedül próbálnád megoldani a dolgokat!” Ez a mondat mindkettőnket mélyen megbántott, és Viktória sírva hagyta el a szobát.\nNéhány napig alig beszéltünk, és ez az időszak nagyon nehéz volt. Éreztem, hogy valamit helyre kell hoznunk, de nem tudtam, hogyan kezdjünk hozzá. Hiányzott a nevetése, a társasága, és az a közelség, amit korábban éreztünk.\nAztán egy este, amikor már nem bírtam tovább, felkerestem őt. Amikor kinyitotta az ajtót, éreztem, hogy még mindig szomorú. Leültünk beszélgetni, és mindketten megnyíltunk. Viktória elmondta, hogy nem azért távolodott el, mert nem szeretne engem, hanem mert saját magával küzdött: az önállóság elvesztése és az új élethelyzet feldolgozása nehezebb volt, mint gondolta. Én is beismertem, hogy talán túlzottan rátelepedtem, és nem adtam meg neki a kellő teret, hogy felfedezze saját útját.\n„Sajnálom, hogy megbántottalak” – mondtam őszintén, miközben megfogtam a kezét. „Tudom, hogy erős vagy, és bízom benned. Csak annyit kérek, hogy engedd, hogy melletted legyek, amikor szükséged van rám.”\nEkkor Viktória rám nézett, és egy halvány mosoly jelent meg az arcán. „Én is sajnálom, hogy eltaszítottalak magamtól. De szeretnék veled együtt erősödni, nem csak melletted.”"]]}, {"n": 5, "items": [["p", "Ez a beszélgetés hozta vissza a köztünk lévő harmóniát. Megtanultuk, hogy a kapcsolatunk nemcsak a nevetésről és a boldog pillanatokról szól, hanem arról is, hogy együtt képesek legyünk megoldani a nehézségeket. A kibékülés után újra közelebb kerültünk egymáshoz, és még inkább éreztük, hogy ez a kapcsolat mélyebb, mint valaha gondoltuk.\nA viták és a kibékülések csak erősebbé tettek minket. Ahogy Roland és Viktória kapcsolatuk mélyülésével egyre többet tanultak egymástól, egyre közelebb kerültek ahhoz, hogy közös jövőt tervezzenek. Az együtt töltött idő során mindketten felfedezték, milyen jó hatással vannak egymásra, és hogyan tudnak segíteni a másiknak, hogy erősebbé váljon. Roland megfigyelte, ahogyan Viktória egyre magabiztosabb lett nemcsak a fehér bottal való közlekedésben, hanem a mindennapi tevékenységekben is. Ahogy együtt nevetgéltek, tanultak és időt töltöttek, Roland egyre inkább úgy érezte, hogy talán itt az idő egy következő lépésre.\nEgyik este, amikor egy vacsora után közösen ücsörögtek a kanapén, Roland finoman felhozta a témát.\n„Viktória... gondoltál már arra, hogy... mi lenne, ha együtt élnénk?” – kérdezte óvatosan, miközben figyelte, hogy milyen reakciót vált ki a lányból.\nViktória elhallgatott egy pillanatra, és Roland érezte, hogy a levegő megfeszül körülöttük. Végül Viktória megszólalt: „Roland... én is sokat gondolkodtam ezen. Hihetetlenül sokat jelent nekem, hogy itt vagy mellettem, és hogy együtt tanulunk meg mindent... de még időre van szükségem. Még nem állok készen arra, hogy összeköltözzünk.”"]]}, {"n": 6, "items": [["p", "Rolandnak összeszorult a szíve. Bár megértette Viktória aggodalmát, és tudta, hogy ez egy nagy lépés, mégis mélyen elszomorította a válasz. Annyira vágyott rá, hogy közösen építsék fel az életüket, és ez a döntés kicsit visszavetette az elképzeléseit. Csendben bólintott, és próbált mosolyogni.\n„Persze... megértem” – mondta Roland, bár a hangjában rejlő szomorúság nehezen volt elrejthető. „Csak azt szeretném, ha tudnád, hogy én itt vagyok neked. Bármikor, amikor készen állsz.”\nViktória megfogta Roland kezét, és szorosan magához húzta. „Tudom, Roland. És nagyon sokat jelent, hogy ilyen türelmes vagy velem. Csak... idő kell, hogy meg tudjam hozni ezt a döntést.”\nEz a beszélgetés után Roland kicsit szomorúan tért haza. Bár tudta, hogy Viktóriának igaza van, és türelmesnek kell lennie, a bizonytalanság érzése mégis nehezen hagyta nyugodni. De ahogy visszagondolt mindenre, amit együtt átéltek, arra gondolt, hogy az igazi szeretet a megértésről és a türelemről szól. Így hát elhatározta, hogy hagy időt Viktóriának, és támogatja őt, bármilyen döntést is hoz. Másnap Roland izgatottan indult el Viktóriához. A tegnap esti beszélgetés óta, bár egy kicsit csalódott volt, megértette, hogy időre van szüksége. Úgy érezte, ma egy új nap kezdetén egy friss, támogató barátként folytathatják tovább. Amikor megérkezett a házhoz, bekopogott az ajtón, de senki nem nyitott ajtót. Várt néhány pillanatot, majd újra próbálkozott, de ismét semmi.\nRoland értetlenül állt a bejárat előtt. \"Hol lehetnek?\" – gondolta magában. Nemrég beszéltek, minden rendben volt. Talán csak elmentek valahová. De valami nem hagyta nyugodni, egy furcsa érzés kavargott a gyomrában. \"Remélem, nincs semmi baj,\" mondta magában, ahogy lassan elindult hazafelé."]]}, {"n": 7, "items": [["p", "Ahogy elérte az utca végét, csörgött a telefonja. Azonnal meglátta a kijelzőn Viktória anyukájának nevét. Szíve egy pillanatra megállt.\n– Szia, Roland – kezdte az asszony hangja, amelyben érezhető volt a feszültség. – Viktória most kórházban van...\n– Mi történt? – kérdezte Roland, érezve, hogy a torka összeszorul.\n– Ma reggel nem érezte jól magát, és azonnal bevittük. Az orvosok agydaganatot diagnosztizáltak nála. Még nem tudjuk, mi lesz pontosan, de most az intenzíven van.\nRoland szinte nem is hallotta a mondat végét. Az \"agydaganat\" szó visszhangzott a fejében, mintha minden más megszűnt volna létezni. \"Ez nem lehet igaz\" – gondolta, miközben a kezei remegni kezdtek. Ahogy Roland letette a telefont, szinte mozdulni sem bírt. Az agydaganat szóra nem volt felkészülve. Az utcán állva úgy érezte, mintha a világ hirtelen összeroskadt volna körülötte. De nem volt ideje a sokkban maradni – tudta, hogy Viktória mellett kell lennie. Azonnal sietett a kórházba, miközben a szíve hevesen vert, és agya zakatolt a gondolatoktól.\nAmikor megérkezett, a váróteremben találkozott Viktória anyukájával, aki elcsigázottnak és szomorúnak tűnt, de próbált erős maradni. Roland nem sokat kérdezett, csak annyit mondott: „Be szeretnék menni hozzá.”\nAz asszony bólintott, és Roland hamarosan Viktória ágyánál találta magát. A gépek halk zúgása töltötte be a szobát, a levegő nehéz volt a bizonytalanságtól. Viktória ott feküdt, nyugodtnak tűnt, de Roland érezte, hogy a helyzet súlya szinte elviselhetetlen. Leült mellé, óvatosan megfogta a kezét, mintha attól félne, hogy ha erősebben szorítaná, megtörne valami.\nHalk, szinte suttogó hangon beszélni kezdett hozzá:\n– Soha nem hagylak magadra, Viktória. Bármi is történjen, bárhogy is alakul... melletted maradok. Mindig."]]}, {"n": 8, "items": [["p", "Viktória anyukája a sarokban állt, csendben figyelte Rolandot, és ahogy meghallotta ezeket a szavakat, szeme megtelt könnyel. A könnycseppek lassan végig folytak az arcán, bár Roland ezt nem látta. Ő teljesen Viktóriára koncentrált, és arra, hogy erőt adjon neki, még ha nem is tudta, hallja-e őt. Néhány nap telt el, és Viktória lassan kezdett magához térni. Az orvosok megfigyelés alatt tartották, és fokozatosan ébredt fel a kábultságból. Amikor kinyitotta a szemét, arcán zavartság tükröződött – nem értette pontosan, mi történt vele. Éppen Viktória anyukája volt bent nála, aki lágy mosollyal fogta a kezét, és próbált erőt adni neki.\n– Hol vagyok? – kérdezte halkan Viktória.\n– Kórházban vagy, drágám. De most már minden rendben lesz – válaszolta az anyukája. – Roland is hamarosan itt lesz.\nNem sokkal később Roland érkezett meg a kórházba, miután megtudta, hogy Viktória kezd magához térni. Szíve gyorsan vert, ahogy az ajtón belépett. Amikor Viktória érezte Roland jenelétét, halvány mosoly jelent meg az arcán.\n– Örülök, hogy itt vagy – mondta Viktória, bár még mindig fáradt volt a hosszú napoktól. Roland közelebb lépett, és leült mellé.\n– Hogy érzed magad? – kérdezte gyengéden, miközben megfogta a kezét.\n– Jobban – válaszolta halkan Viktória, majd egy pillanatra csendben maradt, mielőtt folytatta. – Hallottam, amit suttogtál a fülembe... hogy nem hagysz magamra, bármi is történjen.\nRoland meghökkent, és szíve egyszerre szorult össze és repesett a boldogságtól. Nem volt biztos benne, hogy Viktória hallotta-e őt akkor.\n– Igen – mondta halkan, a szemébe nézve. – És komolyan gondoltam. Bármi történjék, itt leszek melletted.\nViktória elmosolyodott, szemében a remény csillogott."]]}, {"n": 9, "items": [["p", "– Mertem remélni, hogy megtartod az ígéretedet – mondta halkan, de az arcán látszott, hogy erősödik benne a hit és a bizalom Roland iránt. Miközben Roland és Viktória éppen a jövőről beszélgettek, hirtelen megjelent a kezelőorvos. Komoly, de megnyugtató hangon szólt hozzájuk:\n– Jó napot, Viktória! Jó hírem van: a diagnózis alapján csak egy apró műtétre lesz szükség, hogy eltávolítsuk a daganatot. Ez viszonylag rutinszerű beavatkozás, de érthető módon mégis nagy figyelmet igényel. A műtétet holnapra terveztük, ha minden rendben megy.\nViktória arca hirtelen elsápadt. A \"műtét\" szó hallatán érezte, hogy a félelem eluralkodik rajta. Szemei aggódva villantak Roland felé, de ő már szorosan fogta a kezét, és azonnal éreztette vele, hogy mellette van.\n– Ne aggódj, minden rendben lesz – mondta Roland halkan, mintha csak neki súgta volna. – Itt leszek veled minden lépésnél.\nAz orvos folytatta:\n– Az édesanyjának is bele kell egyeznie a műtétbe, és természetesen szükség lesz a további kezelésre is. A műtét után Viktória sugárkezelésre fog járni hat héten keresztül, hogy biztosítsuk a teljes gyógyulást.\nViktória anyukája habozás nélkül beleegyezett a műtétbe, bár az aggódás látszott az arcán. Tudta, hogy ez az egyetlen út a gyógyuláshoz.\nMásnap a műtét reggelén Roland korán érkezett a kórházba, hogy támogassa Viktóriát. A műtő ajtajánál állva még utoljára megszorította a kezét, és biztatóan mosolygott rá."]]}, {"n": 10, "items": [["p", "– Bármi történjék, melletted vagyok – mondta, és Viktória halványan visszamosolygott, bár szemeiben még mindig félelem csillogott. Teltek-múltak a hetek és Roland és Viktória egyre izgatottabban tervezték a közös kirándulásukat. Számukra a világ felfedezése elsősorban az érzékszerveiken keresztül történt: a hangok, illatok és tapintás jelentette a természet gazdagságát. Mivel mindketten látássérültek voltak, egy kirándulás számukra különleges kihívásokat is tartogatott, de ez nem tántorította el őket.\nAz indulás előtt azonban történt valami, ami megváltoztatta a terveiket. Egy nap Roland sétálni ment a városban, és véletlenül megbotlott egy járdaszegélyben. Az esés nem volt komoly, de a fehér botja, ami évek óta a hűséges társa volt, eltörött.\n– Ez így már nem használható – mondta Roland szomorúan, ahogy kezében tartotta a sérült botot. Ez az eszköz nemcsak a közlekedéshez, hanem a tájékozódáshoz is elengedhetetlen volt számára. A világot ezzel a bot segítségével \"látta\", érzékelte az előtte lévő tereptárgyakat, akadályokat, és vezette őt az úton.\nViktória figyelmesen hallgatta Roland szavait, és finoman megérintette a karját.\n– Ne aggódj – mondta megnyugtatóan. – Keresünk egy új botot, olyat, ami még jobban megfelel neked. Az új segédeszköz talán könnyebb is lesz, és praktikusabb.\nRoland először nem volt elragadtatva az ötlettől. Egy új botot keresni nem egyszerű feladat, hiszen nagyon fontos, hogy kényelmes, biztonságos és praktikus legyen, főleg egy hosszabb kirándulás során. Azonban Viktória unszolására végül leültek együtt, és elkezdték böngészni a különféle látássérültek számára készült segédeszközöket."]]}, {"n": 11, "items": [["p", "Az érzékszerveikre hagyatkozva keresték az ideális botot. A leírások olvasó alkalmazással dolgoztak, így részletesen hallgatták meg az anyagok és funkciók ismertetését. Az egyik opció egy könnyű, összecsukható fém bot volt, neoprén markolattal, ami biztos fogást nyújtott. A bot könnyen szállítható volt, és a vége egy érzékeny tapintófejjel rendelkezett, amely még a finomabb talajváltozásokat is érzékelte.\n– Ez tökéletes lehet – mondta Viktória, amikor megtalálta a botot. – Összecsukható, könnyű és nagyon strapabíró. A neoprén markolat pedig biztosítja, hogy hosszú távon is kényelmes legyen a használata.\nRoland végigsimította a bot anyagának leírását, és elképzelte, milyen érzés lesz a kezében tartani. A fém váz megbízhatónak tűnt, és a neoprén markolat tényleg praktikus választásnak bizonyult, főleg, ha hosszú ideig használja.\n– Rendeljük meg – mondta végül Roland, és ahogy leadták a rendelést, mindketten izgatottan várták, hogy megérkezzen az új segédeszköz.\nA napok lassan teltek, és bár Roland várta az új botot, valami más is motoszkált benne. Egyik este, amikor együtt ültek a csendes nappaliban, Roland megosztotta Viktóriával az aggodalmait.\n– Azt hiszem, nem csak a bot hiánya miatt nem tudtam eddig elindulni – vallotta be Roland, lassan megforgatva a szavakat. – Attól tartok, hogy a kirándulás túl sok lesz számomra. A természet hangjai és érzetei túl intenzívek, és félek, hogy elveszítem a kontrollt.\nViktória, aki mindig érezte Roland finom változásait, megszorította a kezét.\n– Ne félj – mondta gyengéden. – Együtt fogjuk felfedezni a világot, lépésről lépésre. Az új botod segíteni fog, de a legfontosabb, hogy nem vagy egyedül. Az érzékeink erősebbek lesznek, ha együtt tapasztaljuk meg a természetet."]]}, {"n": 12, "items": [["p", "Roland elmosolyodott, és érezte, hogy a belső félelmei kezdenek szertefoszlani. Nem az új bot fogja megadni számára a biztonságot, hanem az a tudat, hogy van valaki, aki végig vele lesz az úton. Így hát, miközben az új segédeszközre vártak, Roland már nem félelemmel, hanem izgatottsággal tekintett a közelgő kirándulásra, ami talán nemcsak a tájat, hanem őt magát is megváltoztatja majd.\nA műtét sikeres volt, komplikációk nélkül zajlott. Amikor Viktóriát visszavitték a szobájába, Roland és az anyukája ott várták, és fellélegeztek a jó hír hallatán. Az orvosok azonban figyelmeztették, hogy a sugárkezelésre mindenképpen szükség lesz a következő hat hétben.\nViktória fáradtan feküdt az ágyban, de megkönnyebbült, hogy a műtét jól sikerült. Roland ismét a kezét fogta, és nyugtatóan mosolygott rá.\n– Megcsináltad – mondta halkan. – Most már csak előre kell nézni. Együtt átvészeljük ezt is.\nViktória bár kimerült volt, érezte, hogy a Roland iránti bizalom és szeretet még erősebb lett. Pár nap elteltével Viktória állapota javult annyira, hogy hazaengedhették a kórházból. Roland szinte felvillanyozódott a hír hallatán. Amikor megérkezett érte, nem tudta elrejteni az örömét, de közben tisztában volt vele, hogy a sugárkezelés komoly megpróbáltatás lesz, és Viktóriának sok pihenésre lesz szüksége.\n– Végre itthon – mondta Viktória, amikor beléptek az ajtón. Bár fizikailag még gyenge volt, lelkileg megerősödve tért haza. Roland segített neki kényelmesen elhelyezkedni a kanapén, majd leült mellé.\n– Tudod, hogy a sugárkezelés megvisel majd... – mondta Roland halkan, miközben gyengéden megsimogatta a lány kezét. – De ne aggódj, minden alkalommal veled megyek. Nem hagylak magadra ebben sem.\nViktória hálásan pillantott rá, és mosoly kúszott az arcára, még ha fáradt is volt."]]}, {"n": 13, "items": [["p", "– Nagyon sokat jelent nekem, hogy itt vagy – válaszolta halk hangon. – Nem tudom, hogyan csinálnám ezt nélküled.\nRoland eltökélten bólintott. Tudta, hogy a következő hat hét nehéz lesz, és Viktória legyengülhet a kezelések miatt, de számára ez nem számított. Minden egyes alkalommal ott lesz mellette, és minden erejével azon lesz, hogy támogassa.\nAhogy telt az idő, Viktória sugárkezelései megkezdődtek, és bár a kezelések nehézségei lassan nyomot hagytak rajta, Roland mindig ott volt mellette, hogy bátorítsa és emlékeztesse arra, hogy együtt erősebbek.\n– Csak tarts ki – mondta Roland egyik nap, amikor hazafelé tartottak egy újabb kezelés után. – Minden egyes nap közelebb visz a gyógyuláshoz. És én mindig itt leszek melletted.\nViktória fáradtan, de reménykedve mosolygott. Tudta, hogy bármilyen nehéz is lesz a következő időszak, Roland támogatása segíteni fog abban, hogy átvészelje. Lassan beköszöntött az ősz. A levelek aranylóan hullottak a fák ágairól, ahogy Viktória és Roland az utolsó sugárkezelés után hazafelé tartottak. Az utca csendes volt, a friss, őszi levegő hűvösen simogatta az arcukat. Útjuk egy tó mellett vezetett, ahol Viktória tudta, hogy van egy pad, ahol gyakran megpihentek a nehéz napok után.\n– Üljünk le egy kicsit – javasolta Viktória, miközben Roland karjába kapaszkodva lassan a pad felé vezette őt. Amikor leültek, egy pillanatra elhallgattak, élvezve a természet csendjét.\nViktória mély levegőt vett, majd kissé tétován, de őszinte kíváncsisággal megszólalt:\n– Roland, gondolkodtál már azon, mi történne, ha te holnaptól újra látnál? – kérdezte halkan. – Ugyanígy viselkednél velem? Ugyanúgy maradnál mellettem, ha újra látó lennél?"]]}, {"n": 14, "items": [["p", "Roland egy pillanatra meglepődött a kérdésen. Mélyen elgondolkodott, mielőtt válaszolt volna, és tekintete lágyan pihent meg Viktórián.\n– Igen – mondta végül határozottan, de gyengéden. – Az, hogy látok-e vagy sem, nem változtat azon, amit irántad érzek. Nem azért vagyok veled, mert most nem látok, hanem azért, mert melletted akarok lenni. Az érzéseim nem a látásomhoz kötődnek. Akkor is ugyanígy éreznék, ha holnap újra látnék.\nViktória arca ellágyult, miközben egy könnycsepp gördült végig az arcán. Bár a kezelés végére ért, és a nehezebb időszak mögöttük volt, Roland szavai megnyugtatták és megerősítették abban, hogy a köztük lévő kapcsolat mélyebb, mint bármelyik fizikai állapot.\n– Mertem remélni – suttogta halkan, és egy hálás mosolyt küldött Roland felé. – Tudom, hogy te mindig őszinte vagy velem.\nRoland finoman megérintette Viktória kezét, és megszorította, mintha ezzel akarná kifejezni mindazt, amit a szavak nem tudtak.\n– A kapcsolatunk nem azon múlik, hogy látunk-e vagy sem – mondta Roland komolyan. – Én azért vagyok veled, mert szeretlek. Bárhogy is alakul, mindig melletted maradok."]]}, {"n": 15, "items": [["p", "Ahogy a tó partján ültek, a fák susogása és a víz halk csobbanása kísérte a beszélgetésüket. Mindketten tudták, hogy a legnagyobb kihívásokat is együtt tudják leküzdeni, függetlenül attól, hogy milyen akadályok kerülnek eléjük. Teltek-múltak a hetek és Roland és Viktória egyre izgatottabban tervezték a közös kirándulásukat. Számukra a világ felfedezése elsősorban az érzékszerveiken keresztül történt: a hangok, illatok és tapintás jelentette a természet gazdagságát. Mivel mindketten látássérültek voltak, egy kirándulás számukra különleges kihívásokat is tartogatott, de ez nem tántorította el őket. Roland és Viktória sok válogatás után végül a balatonföldvári Anna Hotel mellett döntöttek, és mivel mindketten látássérültek, az út izgalmas kihívást jelentett számukra, hiszen egy teljesen ismeretlen környezetben találták magukat.\"\nElső nap – Érkezés Balatonföldvárra\nA vonat lassan érkezett meg Balatonföldvárra, a késő tavaszi napfény melegen sütött az utasokra. Roland és Viktória fáradtak, de izgatottak voltak. A hosszú út után végre kiszállhattak, és a friss levegőt beszívva elindultak az Anna Hotel felé, amely végül nem volt messze a vasútállomástól, de biztosra mentek így kértek segítséget mert már nem akartak az első nap el tévedni. Mondta viccesen Roland.\nAz első nap inkább pihenéssel telt. Miután elfoglalták a szobájukat, sétálni indultak a Balaton partján. A séta során Roland lelkesen mesélt Viktóriának a víz csillogásáról és a vitorlás hajók suhanásáról, amit egykor látott, korábban elvesztette volna a látását. Viktória halk hullámzást hallgatva mélyen beszívta a Balaton friss levegőjét. A nap végén egy csendes vacsorát töltöttek el, nevetve beszélgetünk a jövőjükről. Bár mindketten sejtették, hogy valami fontos dolog vár rájuk, még nem mondtak ki mind."]]}, {"n": 16, "items": [["p", "Második nap – Koncert és a nagy beszélgetés\nA második nap reggelén Roland és Viktória élénken beszélgetve indultak el a közeli koncertre, amit már hetek óta terveztek. A koncertje magával ragadta zenét, különösen Viktóriát, aki a zene hangzását mindig mélyebben élte meg, mint mások. A hegedűk, zongorák hangjai finoman kavarogtak a levegőben, és Viktória átadta magát a zenének. Roland figyelte őt, és csodálta, ahogy Viktória minden apró rezdülését átéli.\nA koncert után sétálni indul, közben beszélgetek a hétköznapokról, a zenéről, de mindketten érezték, hogy van valami, ami még kimondatlan. Viktória néha elhallgatott, mintha mérlegelné, hogy most mondja-e el, ami a szívét nyomja.\nAhogy a nap lassan lement, és visszatértek a szállodai szobájukba, Viktória végre megszólalt\n– Roland, azt hiszem, eljött az idő, hogy beszéljünk valamit\nRoland hirtelen megmerevedett, de próbáld nyugodtnak tűnni. Tudta, hogy valami fontos dolog fog következni.\n– Én is úgy érzem, hogy elérkeztünk egy pontra... – folytatta Viktória óvatosan. – Talán itt az ideje, hogy komolyabb döntéseket hozzunk. Gondolkodtam rajta, és azt hiszem, most már kész vagyok rá... szeretném, ha összeköltöznénk.\nRoland szíve hirtelen hevesen kezdett verni. Egyszerre érezte a meglepetést, a boldogságot és az aggodalmat is. Régóta vágyott erre a pillanatra, de most, hogy Viktória kimondta, egyszerre érzett örömöt és félelmet.\n– Biztos vagy benne? – kérdeztem óvatosan, próbálva palástolni a hirtelen támadt idegességét. – Ez egy nagy lépés, és tudod, hogy nagyon fontos, hogy te is teljesen készen állj\nViktória mosolygott."]]}, {"n": 17, "items": [["p", "– Igen, Roland. Készen állok. Sok mindenen átmentünk együtt, és úgy érzem, most már semmi nem tart vissza. Szeretnék veled élni, megosztani veled a mindennapjaimat. Nem akarom többé külön tölteni az estéket, és nem akarom, hogy távol\nRoland szívét elöntötte a melegséget. Viktória elhatározása nemcsak meglepte, hanem boldoggá is tette. Mélyen a szívében mindig is ezt akarta, de a kapcsolatuk eddigi nehézségei miatt félt attól, hogy talán túl korai lenne. Most azonban, ahogy Viktória arcát nézte, érezte, hogy eljött az ideje\n– Rendben – mondta halkan, majd egyre magabiztosabban. – Ha te is így érzed, akkor itt az ideje.\nA beszélgetés után sokáig beszélgettek az összeköltözés részleteiről: hogyan rendezik be a közös lakást, milyen feladatokat osztanak meg egymás között, és hogyan alakítják majd az új életüket együtt.\nHarmadik nap – A közös jövő tervezése\nA harmadik nap reggelén mindketten frissen és izgatottan ébredtek. Az előző esti beszélgetés után úgy érezték, mintha egy új fejezet kezdődött volna az életükben. A napot egy hosszú sétával kezdték a Balaton partján, ahol újra és újra a jövőjükről beszélgettek. Roland érezte, hogy a félelmei kezdenek szertefoszlani, ahogy egyre magabiztosabb lett abban, hogy képes leszek együtt boldogulni.\nKözben elhatározták, hogy a következő héten elkezdenek keresni egy közös lakást. Viktória ragaszkodott hozzá, hogy a lakás legyen akadálymentes, és legyen benne egy világos, tágas nappali, ahol közösen pihenhetnek és beszélgethetnek. Rolandnak nem volt ellenére az ötlet, és egyre lelkesebben beszéltek arról, hogyan alakítanák ki az új otthont\nDélután egy kisebb hajókirándulásra mentek a Balatonon, ahol több közös terv született. Ahogy a hajó halk zúgása mellett ültek a fedélzeten, Viktória finoman megszorít"]]}, {"n": 18, "items": [["p", "– Tudod, soha nem hittem volna, hogy idáig eljutunk – mondta halkan. – Annyi mindent átéltünk, és most itt vagyunk, egy hajón, egy közös élet küszöbén\nRoland elmosolyodott, és\n– Én sem – válaszol. – De most már biztos vagyok benne, hogy bármi történjék is, együtt minden akadályt legyőzünk.\nAz estét egy újabb koncerttel zárták, majd visszatértek a hotelbe, ahol már könnyedséggel és derűvel beszéltek a jövőről. Roland tudta, hogy Viktória döntötte véglegesen, és hogy együtt készülnek egy új, közös életre. A kirándulás végére mindketten megerősödve, boldogan és reményteljesen tértek vissza a hétköznapokba, készen arra, hogy megvalósítsák közös álmaikat.\nA napos kirándulás nemcsak egy új élmény volt, hanem egy új kezdet is, ahol Viktória és Roland végleg eldöntötték, hogy együtt élik a jövőjüket. Nem is olyan régen, amikor először vette kezébe a fehér botját, teljesen elveszett érezte magát. Azelőtt soha nem gondolta volna, hogy szüksége lesz rá, de amikor elérkezett a pillanat, nem volt választása. Akkoriban minden lépés bizonytalan volt, és minden akadály óriásinak tűnt. Már hazafelé tartva a vonaton, Roland elmerült a gondolataiban, és visszaemlékezett arra az időre, amikor mindent megtanult, ami most a sikeréhez vezetett.\n„Milyen ügyetlen voltam…” – gondolta magában mosolyogva, ahogy eszébe jutottak az első napok, amikor még tanulta a botot. Az oktatója, Zsuzsanna, mindig bízott benne, még akkor is, amikor ő maga már feladni készült. Zsuzsanna egy életteli, energikus nő volt, aki pontosan tudta, hogyan kezelje a félelmeket és a bizonytalanságot"]]}, {"n": 19, "items": [["p", "„Ne aggódj, Roland, ez csak egy eszköz, nem az ellenséged” – mondta neki gyakran az oktatás során. Az elején Roland még képtelen volt magabiztosan használni a botot. Emlékezett egy esetre, amikor egy forgalmas utcán botladoztak végig, és a fehér bottal majdnem fellöktek valakit. A helyzet kínos volt, de Zsuzsanna csak nevetett, és Roland is hamarosan csatlakozott hozzá a nevetésben\n„Egy-két ilyen apró baleset után már könnyebben fogsz mozogni” – biztatta őt Zsuzsanna. És valóban, ahogy teltek a hetek, Roland egyre ügyesebb lett, és végül megtanulta, hogyan érzékelje a járdák szélét, hogyan hallgassa a hangokat, és hogyan mozogjon magabiztosan tömegben\nEgyik legemlékezetesebb pillanata az volt, amikor először sikerült egyedül végig mennie a városon a bottal anélkül, hogy bármilyen nagyobb akadályba ütközött volna. Az apró sikerek sokat okoznak neki akkoriban, máig emlékszik az örömre, amit akkor érzett. Roland elmosolyodott, majd bólintott. „Csak azon gondolkodtam, milyen ügyetlen voltam, amikor először használtam a fehér botomat. Nem is értem, hogy jutottam el idáig, hogy most már teljesen magabiztos.\nViktória nevetett, és megérintette Roland karját. „És most te vagy az, aki nekem tanítottad meg, hogyan használd!”"]]}, {"n": 20, "items": [["p", "Ez a beszélgetés újra eszébe juttatta Rolandnak, milyen sokat jelent a fejlődés, amelyen keresztül ment az évek során. Már nem félt a világtól, mert megtanulta, hogy a nehézségek nem korlátozhatják őt, ha van benne bátorság, és olyan emberek veszik körül, akik hisznek benne. És Viktória most magabiztos volt mellette, mint annak idején ő Zsuzsanna mellett. Roland büszke volt Viktóriára, mert érzékelte, hogy most ő járja azt az utat, amit ő maga már megtett, és jó úton halad. Ez az elhatározottság és fejlődés büszkeséggel töltötte el Rolandot, hiszen tudta, hogy Viktória nemcsak tanul, hanem képes önállóan boldogulni a mindennapokban. Lassan hazaérkeztek, és hazafelé tartva Roland és Viktória megbeszélték, hogy ideje lenne egy családi összejövetelt szervezni. Úgy döntöttek, hogy ezen a találkozón mondják el a családjuknak, hogy szeretnének összeköltözni. Bár sem Roland, sem Viktória nem lát, úgy érzi, most már képes együtt élni, és készen boldog a közös életre. Kíváncsian várták, hogyan fogadja a családjuk a hírt, ezért izgatottan készültek a nagy bejelentésre. Pár nap pihenés után, miután Roland és Viktória hazaérkeztek, úgy döntöttek, hogy kipróbálják, hogyan megy nekik a közös főzés. Abban egyeztek meg, hogy ha jól sikerül, meghívják a szülőket is, mert fontos közlendőjük van. Amikor megérkeztek Roland szülei is, mindenki segített az asztalterítésben, és izgatottan várták, hogyan sikerül a vacsora, mit sem sejtve arról, hogy nem ez lesz az egyetlen meglepetés, ami rájuk vár az este folyamán. Leültek a szépen megterített asztalhoz, és mindenki annyit szedett, amennyit úgy érzi, hogy meg tud enni. A szerelmes pár izgatottan várta a reakciókat, mindenki kellemesen beszélgetett, élvezve az együtt töltött időt. Mindenki nekilátott az evésnek, és hirtelen gyanúsan csend lett"]]}, {"n": 21, "items": [["p", ". Viktória és Roland gondolkodtak magukban: talán ennyire rossz lett, vagy éppen annyira jó, hogy senki nem jut szóhoz? Ekkor Roland anyukája mosolyogva megszólalt: „Na fiam, amikor még csak néztél, hogy mit csinálok a konyhában, hát sok mindent elleshettél tőlem anno.” Aztán Viktória felé fordult, és kedvesen folytatta: „Drágám, de mivel közösen főztek, neked is jár a dicséret,” majd megfogta a kezét. Közben az apukák szinte mit sem törődve az asztal körüli történésekkel, folytatták saját beszélgetéseiket politikáról, autókról és minden másról. A családi összejövetelen Roland váratlanul figyelmet kért, hogy bejelentsen valamit. Mindenki kíváncsian figyelt, ahogy megszólalt: „Eljön az idő, amikor mindenkinek ki kell repülnie a családi fészekből, és saját életet építenie. Én Viktóriában megtaláltam azt az embert, akivel közös jövőt tudok elképzelni, ezért szeretnénk összeköltözni.”\nViktóriát meglepetésként érte ez a bejelentés, szinte meg sem tudott szólalni. De végül bátorságot vett, és szülei felé fordult. Édesapja először csendben maradt, majd ráncolt homlokkal kérdezte: „Lányom, biztosnak érzed ezt az összeköltözést?” Hangjában kétely volt, de tudta, hogy lánya már felnőtt, így nem igazán akart beleszólni. Viktória határozottan válaszolt: „Igen, apám, mi Rolanddal ketten egyek vagyunk és szeretem vele képzelem el a jövőmet.”\nRoland anyukája, látva a feszültséget a szobában, halk zenét indított el a háttérben, hogy egy kicsit oldja a hangulatot. A dallam eleinte alig hallatszott, és senki sem figyel rá különösebben, mindenki a saját gondolataiba merült. Ám néhány perc elteltével Viktóriának megütötte a fülét a zene. Hirtelen Roland felé fordult, arcán egy pajkos mosollyal, és játékosan megjegyezte\n– Ezt még nem próbáltuk. Mit szólnál, ha táncolnánk?"]]}, {"n": 22, "items": [["p", "Roland először meglepődött, egy pillanatra habozott, de a kíváncsiság győzött benne. Felállt, kissé zavarban kinyújtotta a kezét, és hagyta, hogy Viktória vezesse a ritmusra. Az első néhány lépés kicsit darabosra sikerült, Roland mozdulatai ügyetlenek voltak, de ahogy belemerültek a pillanatba, mindketten elnevették magukat. A nevetésük oldotta a hangulatot, és hamarosan felszabadultabban mozogtak. A humorral és őszinteséggel teli pillanatban mindketten ráébredtek, mennyire fontos nekik ez a közelség. Bár egyszerű, kissé esetlen táncuk volt csak, mégis valami mélyebb érzést hozott a felszínre – mintha ez a rövid tánc lehetőséget adott volna arra, hogy kiszakadjanak a mindennapokból, és emlékeztette őket arra, hogy bármennyire is bonyolult és kiszámíthatatlan az élet, mindig lehet együtt nevetni, és el lehet téveszteni a lépéseket – hiszen a lényeg, hogy együtt próbálkoznak tovább. Ahogy a nap már lemenőben volt, egy szobában csak a halk zene és a derengő fények maradtak, a szülők fáradtan kezdtek mozogni. Lassan elérkezett az este vége, és úgy döntöttek, ideje haza menni. Roland Viktóriához fordult, akinek a mosolya még mindig ragyogott a tánc emlékétől. Szívem, én is megyek, mert kezdek fáradt lenni – mondta kedvesen, először megfogta Viktória kezét. – De alvás előtt, ahogy szoktuk hívlak, Gyengéden megcsókolta Viktóriát, és a szívükben a tánc öröme még mindig ott lüktetett. A csók édes és rövid volt, de mindkettőjük számára sokat jelentett. Miközben elbúcsúztak, a szobában csendben telepedett, mintha mindenki érezte volna, hogy ez a pillanat különösen fontos. Roland elindult a szülők felé, Viktória pedig még egy utolsó pillantást vetett rá, remélve, hogy másnap újra találkoznak."]]}, {"n": 23, "items": [["p", "Amint Roland kilépett az ajtón, a szívében új érzés fogalmazódott meg: a szeretet és a kötelék, ami Viktóriával összeköti őt, nem csupán egy egyszerű érzés volt, hanem valami sokkal mélyebb és tartósabb. Most már biztos volt benne, hogy együtt szeretnék folytatni azt az utat. Roland másnap reggel izgatottan kopogott Viktória ajtaján. Viktória mosolyogva nyitotta ki az ajtót, ahogy beljebb vezette, mindketten leültek a kanapéra, szinte tapintható volt köztük az izgalom. Ahogy Viktória elmondta Rolandnak, hogy sajnálja, hogy nem látják mindent a lakással kapcsolatban, Roland pl.\n„Kedvesem, ne aggódj emiatt. Még ha nem is minden tökéletes most, a lényeg az, hogy mi együtt vagyunk, és bármi lehetséges, ha egy irányba haladunk. A lakás nem csupán négy fal. Ha mi ketten ott leszünk,\nViktória szemében egy pillanatra megcsillant a reményt, ahogy Roland mellé bújt, és ő is érezte, hogy a szeretetük elég ahhoz, hogy bármin átsegítse őket. Roland átfogta a vállát, és érezte, hogy Viktória minden szava egyre inkább elcsendesíti a szívét\n„De mi van, ha mégis meg kell küzdenünk a nehézségekkel? Mi lesz, ha nem tudjuk elérni, amit akarunk?” kérdezte Viktória, bár hangja egyre halkabb lett, először Roland karjaiban kény\nRoland elmosolyodott, és egy pillanatra mély levegőt vett, majd így válaszol: „A nehézségek mindig ott lesznek, de az is biztos, hogy ha együtt nézünk szembe velük, akkor minden kihívás legyőzhető. A legfontosabb, hogy nem vagyunk egyedül.\nViktória érezte, hogy Roland szavai erőt adnak neki. Bár a bizonytalanság továbbra is ott lebegett, most már tudta, hogy nem kell mindent tökéletesen irányítani. A közös jövőjük a szeretetük erejére épült, és már elég volt ahhoz, hogy elinduljanak az úton, amit közösen választanak."]]}, {"n": 24, "items": [["p", "Roland és Viktória úgy érezték, megérdemelten egy kis kikapcsolódást, ezért egy különleges, látássérültek számára is élvezhető kiállítást szemeltek ki. A városi múzeumban éppen egy tapintható kiállítás nyílt, amely különféle anyagokat és formákat tartalmaz. Amint beléptek a terembe, Viktória izgatottan megszorította Roland kezét.\n„Ez fantasztikus lesz!” – suttogta „Végre valami, amit együtt tudunk felfedezni.”\nKözelebb léptek az első alkotáshoz, egy bronz domborműhöz, amely különböző formák és textúrák találkozásából épült fel. Roland finoman végig húzta ujjait a felületén, mintha képzeletében próbálta volna felidézni, milyen látványt nyújtana.\n„Érzed ezt a részt?” – „És itt mellette egy teljesen sima felület…”\nViktória óvatosan követte az ujjával Roland mozdulatait, majd bólintott.\n„Ez tényleg olyan, mint egy térkép” – „Olyan, mintha együtt fedeznénk fel egy új világot.”\nAhogy tovább haladtak, megálltak egy érdes, kőből készült szóbor előtt. Viktória odahívta Rolandot.\n„Érzed, milyen durva a felszíne? Mintha egy hegy oldalát érintenénk...” – mondta ámulat\nRoland bólintott, és még mélyebben átérezte az érintés révén kialakuló közös élmény jelentőségét.\n„Ez a kiállítás valóban különleges” – „Olyan, mintha a művészet itt nemcsak a szemet, hanem a lelket is megérintené.”\nViktória elmosolyodott, és szorosan megfogta Roland kezét.\n„Ez valóban több, mint művészet... ez egy olyan közös élmény, amit csak mi érthetünk meg ilyen mélyen.” Ahogy haladtak a kiállításon, egy kedves idegenvezető lépett hozzájuk, és üdvözölte őket. **„Ha bármilyen kérdést lenne, bátran forduljanak hozzám” ** – mondta. A túra után, amikor Roland és Viktória már épp elindultak volna kifelé, hirtelen egy ismerős hang szólította\n„Viki? Szia, rég hallottam felőled!”"]]}, {"n": 25, "items": [["p", "Viktória meglepetten állt meg, majd széles mosoly jelent meg az arcán, amikor felismerte a hangot. Roland mellette állva értetlenül hallgatta a beszélgetést, nem tudta, ki lehet az ismeretlen férfi. Az idegen közelebb lépett, és bemutatkozott\n„Szia, Laci vagyok! Remélem, hangról még megismersz” –\n„Igen, persze, Laci! Jó újra hallani téged” – „Mi újság veled, Viki? Rég nem beszéltünk, és kíváncsi voltam, hogy vagy” – kérdezte\nViktória\n„Örülök, hogy összefutottunk. Roland vagyok, Viki párja.”\nLaci válaszol:\n„Örülök a találkozásnak, Roland! Viki és én régi iskolatársak voltunk, sok időt töltöttünk együtt annak idején.”\nA FOLYTATÁS\nÚj fejezetek Roland és Viktória történetében\n1. fejezet – A régi hang\n– Laci vagyok – mondta a férfi, és a hangjában olyan könnyedség volt, mintha csak tegnap váltak volna el egymástól. – Remélem, hangról még megismersz.\nViktória mosolya őszinte volt, de Roland megérezte benne azt a fajta meglepetést, amelyhez még nem tudott kapcsolódni.\n– Persze, hogy megismerlek – felelte Viktória. – Csak nagyon régen hallottam a hangodat.\nLaci ekkor Roland felé fordult.\n– Örülök, hogy találkozunk. Viki sokat mesélt rólad.\nRoland kezet nyújtott. Laci erősen, határozottan fogott vele kezet.\n– Én pedig örülök, hogy végre megismerhetlek – mondta Roland.\nA mondat egyszerű volt, mégis furcsa érzés maradt utána. Nem féltékenység volt. Legalábbis Roland még nem nevezte volna annak. Inkább kíváncsiság.\nLaci és Viktória beszélgetni kezdtek a régi iskoláról. Roland hallgatta őket. Egy-egy név, egy-egy történet bukkant fel a múltból. Volt, amin Viktória nevetett, és volt, amit inkább csendben hagyott.\n– Emlékszel arra a kirándulásra? – kérdezte Laci.\n– Hogyne emlékeznék – válaszolta Viktória."]]}, {"n": 26, "items": [["p", "Roland ekkor először érzett valami különöset. Nem azt, hogy Laci veszélyt jelentene, hanem azt, hogy létezik Viktóriának egy olyan élete, amelybe ő már nem tud visszamenni, mert akkor még nem volt jelen.\nHazafelé sokáig csendben mentek.\n– Haragszol? – kérdezte Viktória.\n– Nem.\n– Akkor miért vagy ilyen csendes?\nRoland elmosolyodott.\n– Csak rájöttem valamire. Azt hittem, már mindent tudok rólad.\nViktória megállt.\n– És most?\n– Most tudom, hogy még rengeteg mindent kell megismernem.\nViktória megszorította a kezét.\n– Akkor ismerj meg.\nRoland ekkor még nem tudta, hogy ez az egyszerű mondat milyen hosszú út kezdetét jelenti.\n2. fejezet – Amit a múlt elrejtett\nA következő napokban Laci neve egyre gyakrabban került szóba. Nem azért, mert Viktória különösen sokat beszélt róla, hanem mert Roland fejében maradt a találkozás.\nEgy este Viktória megkérdezte:\n– Szeretnél róla többet tudni?\nRoland habozott.\n– Igen. De csak akkor, ha te is szeretnél mesélni.\nViktória mély levegőt vett.\n– Laci nagyon fontos volt nekem régen. Nem szerelemként. Inkább barátként. Olyan ember volt, aki akkor is mellettem állt, amikor még én sem tudtam, mit kezdjek a saját életemmel.\n– És miért szakadt meg a kapcsolat?\n– Nem szakadt meg igazán. Csak az élet szétszórt minket.\nA beszélgetés után Roland rájött, hogy a féltékenység nem Laci miatt fáj. Az zavarta, hogy vannak emlékek, amelyekhez neki nincs kulcsa.\nKésőbb Laci újra felhívta Viktóriát. Egy közös régi ismerősük bajba került, és segítséget kértek tőlük egy jótékonysági rendezvény megszervezéséhez. Viktória igent mondott.\nRoland is velük tartott.\nA rendezvény első órái kaotikusan teltek. Elromlott a hangosítás, valaki rossz helyre tette a székeket, a szervező pedig pánikba esett.\n– Ez lesz életünk legnagyobb kudarca – mondta Viktória nevetve."]]}, {"n": 27, "items": [["p", "– Akkor legalább emlékezetes lesz – felelte Roland.\nLaci felnevetett.\nA nap végére azonban minden sikerült. Roland büszke volt Viktóriára. Nem azért, mert segítségre szorult, hanem azért, mert egyre több dolgot vállalt el önállóan.\nEste hazafelé Viktória csendben megjegyezte:\n– Szeretem, amikor nem próbálsz helyettem dönteni.\nRoland megállt.\n– Megint csináltam valamit?\n– Nem. Pont ez az.\nA mondat megnyugtatta. Tudta, hogy tanulniuk kell egymást. A szerelem önmagában nem old meg mindent.\n3. fejezet – Az első közös otthon\nHetekig keresték a lakást. Volt olyan, amelyik túl szűk volt, másiknál a lépcsőház okozott gondot, és olyan is akadt, amelyik elsőre tökéletesnek tűnt, de egyetlen nap után kiderült, hogy a környék tele van nehezen érzékelhető akadályokkal.\nA negyedik lakásnál Viktória megállt a bejáratban.\n– Ezt érzem.\n– Mit?\n– Hogy itt lehetne otthonunk.\nRoland végigsimított a falon.\n– Akkor nézzük meg úgy, mintha már a miénk lenne.\nA nappali tágas volt. Az ablakon beszűrődő utcazaj alapján könnyen meg lehetett állapítani, merre van a bejárat. A konyhában elegendő hely maradt a biztonságos közlekedéshez.\nAmikor végül aláírták a szerződést, egyikük sem látott abból semmit, amit egy költözéshez kapcsolódó fényképen meg lehetett volna örökíteni. Mégis úgy érezték, mintha életük egyik legszebb képe készült volna el.\nAz első este matracokon aludtak a nappaliban.\n– Ez most tényleg a mi lakásunk? – kérdezte Viktória.\n– Igen.\n– Akkor holnap kezdődhet a káosz.\nÉs valóban elkezdődött.\nDobozok, edények, ruhák, könyvek és kábelek kerültek mindenhová. Roland egy dobozt a fürdőszobában hagyott, Viktória pedig egy serpenyőt a hálószobában.\n– Ez így nem lesz jó – nevetett Roland.\n– Dehogynem. Csak még nem tanultuk meg, hol van minden."]]}, {"n": 28, "items": [["p", "Ekkor Roland rájött, hogy pontosan ez a közös élet lényege. Nem az, hogy minden kész legyen. Hanem hogy együtt tanulják meg, hogyan lesz egy idegen helyből otthon.\n4. fejezet – A szabadság ára\nAz első hónapok boldogsága azonban nem tartott örökké változatlanul.\nViktória egyre több mindent akart egyedül intézni. Roland örült ennek, de közben félt is.\nEgy reggel Viktória közölte:\n– Egyedül megyek bevásárolni.\n– Rendben.\n– Tényleg?\n– Tényleg.\nViktória mosolygott.\n– Akkor ne hívj fel tíz perc múlva, hogy hol vagyok.\n– Nem foglak.\nHúsz perc múlva Roland mégis a telefonját szorongatta. Harminc perc után felállt. Negyven perc után már az ajtónál volt.\nAmikor Viktória hazaért, megállt.\n– Te utánam jöttél?\nRoland nem válaszolt.\n– Roland.\n– Csak aggódtam.\n– Tudom. De nem élhetek úgy, hogy minden lépésemnél attól kell tartanom, hogy te megjelensz mögöttem.\nA vita hosszú volt. Talán az eddigi legfájóbb.\n– Nem a vakságom miatt akarok önálló lenni – mondta Viktória könnyes hangon. – Hanem azért, mert én vagyok én.\nRolandnak fájt hallani.\n– Én pedig csak azt akarom, hogy biztonságban legyél.\n– Néha a szereteted is lehet túl nehéz.\nEz a mondat beléhasított.\nAznap külön szobában aludtak.\nRoland egész éjjel azon gondolkodott, hol húzódik a segítség és a féltés határa. Reggelre megértette: aki szeret valakit, annak nem az a feladata, hogy minden akadályt eltávolítson előle. Néha az a legnagyobb szeretet, ha hagyja, hogy a másik maga másszon át rajta.\n5. fejezet – Egy vonat, két út\nNéhány héttel később közös utazást terveztek. Nem akartak nagy dolgot. Csak felülni egy vonatra, leszállni egy ismeretlen városban, és hagyni, hogy a nap vezesse őket."]]}, {"n": 29, "items": [["p", "A pályaudvaron azonban minden rosszul indult. A vonat másik vágányról indult, az információ bemondása nehezen volt érthető, és mire rájöttek, hová kell menniük, már csak perceik maradtak.\n– Fussunk? – kérdezte Viktória.\n– Ketten?\n– Miért, egyedül gyorsabb lennél?\nNevetve indultak.\nAz utolsó pillanatban szálltak fel.\nA vonaton mindketten kifújták magukat.\n– Megcsináltuk.\n– Pedig majdnem lekéstük.\n– De nem késtük le.\nAz út során beszélgettek arról, milyen lenne egyszer hosszabb útra menni. Talán egy másik országba. Talán tengerhez.\nRoland elnevette magát.\n– Két vak ember a tengernél.\n– Miért? A tenger nem csak látvány.\n– Hanem?\n– Hang. Szag. Szél. Sós víz. Homok.\nRoland elcsendesedett.\n– Egyszer elviszlek oda.\nViktória megfogta a kezét.\n– Együtt megyünk. Nem te viszel engem.\n6. fejezet – A féltékenység hangja\nLaci ismét megjelent az életükben. Segített egy közlekedési tréning megszervezésében, majd egyre gyakrabban találkoztak.\nRoland próbált természetesen viselkedni.\nEgyik este azonban Laci és Viktória sokáig beszélgettek telefonon. Roland nem kérdezett semmit.\nMásnap Viktória érezte rajta a feszültséget.\n– Mi van?\n– Semmi.\n– Ismerlek.\nRoland végül kimondta:\n– Néha félek, hogy van valami köztetek, amit én nem értek.\nViktória sokáig hallgatott.\n– Van köztünk valami.\nRoland szíve összeszorult.\n– Barátság – folytatta Viktória. – Egy régi kapcsolat. Egy ember, aki sokat jelentett nekem. De te vagy az, akit szeretek.\nRoland szégyellte magát.\n– Sajnálom.\n– Nem kell bocsánatot kérned azért, hogy félsz. De neked kell megtanulnod, mit kezdesz ezzel a félelemmel.\nLaci később maga is beszélt Rolandon.\n– Nem akarom elvenni tőled Vikit.\n– Tudom.\n– Akkor miért nem hiszel neki?\nRoland nem tudott válaszolni."]]}, {"n": 30, "items": [["p", "Aznap este először értette meg, hogy a bizalom nem azt jelenti, hogy soha nem félünk. A bizalom azt jelenti, hogy a félelem ellenére sem büntetjük azt, akit szeretünk.\n7. fejezet – A nagy veszekedés\nA nyár végére minden feszültség egyszerre tört ki.\nEgy apró félreértésből vita lett. A vita régi sérelmeket hozott elő. Viktória azt mondta, Roland túl sokat akar irányítani. Roland azt mondta, Viktória túl gyakran zárkózik be.\nVégül Viktória sírva kimondta:\n– Nem tudom, hogy így tudok-e veled élni.\nRoland elhallgatott.\n– Akkor talán menj el – mondta.\nA mondat után mindketten tudták, hogy hibát követtek el.\nViktória mégis összepakolt néhány dolgot, és elment az édesanyjához.\nAznap este Roland egyedül maradt a lakásban.\nA csend más volt, mint korábban.\nNem békés volt.\nÜres.\nA konyhában még ott maradt Viktória bögréje. Roland megérintette a szélét, és hirtelen rájött, mennyire természetessé vált számára, hogy a lány ott van.\nMásnap nem hívta.\nHarmadnap sem.\nNegyednap Laci jelentkezett.\n– Viki nem akar beszélni veled.\n– Értem.\n– De szerintem nem azért, mert nem szeret.\nRoland nagyot sóhajtott.\n– Akkor miért?\n– Mert most először magát akarja meghallani.\nRoland elfogadta.\nEz volt élete egyik legnehezebb döntése.\n8. fejezet – Egyedül\nViktória az édesanyjánál töltött hetek alatt sok mindent átgondolt. Rájött, hogy Roland nem rosszat akart. De azt is megértette, hogy a jó szándék önmagában nem elég.\nRoland közben visszament Zsuzsannához.\n– Baj van? – kérdezte az oktató.\n– Elvesztettem valakit.\n– Vagy csak egy időre elveszítetted a közös utat?\nRoland elmosolyodott.\n– Nem tudom.\nZsuzsanna sokáig hallgatott.\n– Emlékszel, mit mondtam az első napon a botodról?\n– Hogy nem az ellenségem.\n– És most mit kell megtanulnod?\nRoland gondolkodott.\n– Hogy Viktória sem az.\nZsuzsanna felnevetett."]]}, {"n": 31, "items": [["p", "– Pontosan.\nRoland lassan elkezdte rendbe tenni az életét. Nem azért, hogy Viktória visszajöjjön, hanem azért, hogy ha visszajön, már ne ugyanaz az ember várja.\nElment önállóan ügyeket intézni. Új útvonalakat gyakorolt. Megtanulta, hogyan kérjen segítséget úgy, hogy közben ne adja fel az önállóságát.\nÉs rájött, hogy Viktóriának is ugyanezt kell megadnia.\nNem megmenteni.\nNem vezetni.\nHanem mellette lenni.\n9. fejezet – A levél\nEgy esős novemberi estén Roland levelet kapott.\nNem elektronikus üzenet volt. Viktória kézzel diktálta le valakinek, mert azt akarta, hogy a szavaknak súlyuk legyen.\nA levélben nem voltak nagy ígéretek.\nCsak őszinteség.\nViktória leírta, hogy hiányzik neki Roland nevetése. Hiányzik, ahogy reggel megkérdezi, kér-e kávét. Hiányzik a közös főzés, még akkor is, ha néha mindent túl sokáig sütnek.\nDe azt is leírta, hogy fél.\nAttól fél, hogy újra elveszíti önmagát.\nRoland sokáig tartotta a levelet a kezében.\nVégül felhívta Viktóriát.\n– Megkaptam.\n– Mit gondolsz?\n– Azt, hogy találkoznunk kell.\nA találkozásuk csendes volt.\nNem ölelték meg egymást azonnal.\nCsak leültek.\n– Nem akarom, hogy visszamenjünk oda, ahol voltunk – mondta Viktória.\n– Én sem.\n– Akkor?\n– Menjünk máshová.\nViktória elmosolyodott.\n– Ez nagyon Rolandos.\n– Ez jó vagy rossz?\n– Most jó.\n10. fejezet – Újrakezdés\nNem költöztek azonnal össze újra. Először csak találkoztak. Egy kávézóban, parkban, könyvtárban, pályaudvaron.\nÚjra megtanulták egymást.\nRoland nem kérdezte minden alkalommal, hová megy Viktória. Viktória pedig megtanulta kimondani, amikor szüksége van segítségre.\nEgyik délután egy ismeretlen útvonalon sétáltak.\nViktória egyszer csak megállt.\n– Menjünk erre.\n– Biztos?\n– Nem.\nRoland nevetett.\n– Akkor miért?\n– Mert eddig mindig a biztos utat kerestük.\nElindultak."]]}, {"n": 32, "items": [["p", "Néhány perc múlva rossz irányba fordultak.\n– Elvesztünk – mondta Roland.\n– Tudom.\n– És?\n– Semmi.\n– Nem félsz?\n– De. Csak most már tudom, hogy attól még mehetünk tovább.\nRoland megfogta a kezét.\nNem vezette.\nCsak fogta.\nAznap döntötték el, hogy újra együtt próbálják meg.\nNem azért, mert elfelejtették a fájdalmat.\nHanem mert megtanultak beszélni róla.\n11. fejezet – A tél próbája\nA tél nehéznek bizonyult. A hó és a jeges járdák különösen próbára tették őket.\nEgy reggel Viktória elesett.\nRoland ösztönösen utána kapott, de Viktória már felállt.\n– Jól vagyok.\n– Biztos?\n– Igen.\nRoland visszafogta magát.\n– Rendben.\nViktória mosolygott.\n– Köszönöm.\n– Mit?\n– Hogy most nem akartál helyettem felállni.\nMindketten nevettek.\nKésőbb egy kis közösségi csoportot kezdtek szervezni látássérült embereknek. A cél egyszerű volt: közös programok, kirándulások, tapasztalatcsere.\nAz első alkalomra kevesen jöttek el.\nA másodikra többen.\nA harmadikra már megtelt a terem.\nRoland rájött, hogy amit egykor csak saját problémának látott, abból másoknak segítséget adó tapasztalat lett.\nViktória pedig először érezte igazán, hogy nemcsak túlélte a látásvesztést.\nHanem új életet épített utána.\n12. fejezet – A tenger ígérete\nTavasszal elővették régi álmukat.\nA tengert.\nHosszú szervezés után útnak indultak. A vonatút fárasztó volt, de tele volt várakozással.\nAmikor megérkeztek, először csak a szelet érezték.\nAztán a hullámok hangját.\nViktória levette a cipőjét.\n– Homok.\nRoland követte.\nA hullám elérte a lábukat.\nMindketten nevettek.\n– Ezért megérte – mondta Roland.\n– Még el sem mondtad, milyen színű a víz.\nRoland elhallgatott.\n– Nem akarom helyetted elképzelni.\nViktória megszorította a kezét.\n– Akkor mesélj róla úgy, ahogy te emlékszel.\nRoland elkezdett beszélni.\nNem a tenger színéről."]]}, {"n": 33, "items": [["p", "Hanem arról, milyen volt gyerekként először meglátni. Milyen volt a napfény. A horizont. A távolság.\nViktória pedig arról mesélt, mit hall most.\nA hullámokról.\nA szélről.\nA kavicsok mozgásáról.\nA két külön történet végül ugyanarról szólt.\nArról, hogy ugyanazt a világot két különböző módon lehet megtapasztalni.\n13. fejezet – A gyűrű\nA tengerparton Roland sokáig nem találta a megfelelő pillanatot.\nNem akart nagy jelenetet.\nNem akart tökéletes mondatot.\nVégül este, amikor már csak a hullámok hangja maradt, elővette a kis dobozt.\nViktória azonnal megérezte, hogy valami megváltozott.\n– Roland?\n– Nem látom, milyen arcot vágsz.\n– Most éppen sírok.\n– Akkor jó helyen járok.\nViktória felnevetett a könnyein keresztül.\nRoland megfogta a kezét.\n– Nem azt ígérem, hogy soha nem fogunk veszekedni. Nem azt ígérem, hogy mindig tudni fogom, mit kell mondani. Azt sem ígérem, hogy könnyű lesz.\nViktória csendben hallgatta.\n– Azt ígérem, hogy ha eltévedünk, keresni fogom veled az utat. Ha elesel, megkérdezem, kell-e segítség. Ha én esem el, remélem, te is megkérdezed. És ha egyszer egyikünk sem tudja, merre tovább, akkor leülünk, és együtt gondolkodunk.\nA gyűrűt Viktória kezébe tette.\n– Hozzám jössz?\nViktória sírva nevetett.\n– Igen.\nNem volt taps.\nNem volt zene.\nCsak a tenger.\nÉs két ember, akik végre nem a tökéletes életet keresték, hanem a közös életet.\n14. fejezet – Az esküvő előtti vihar\nAz eljegyzés után azonban újabb nehézségek jöttek.\nA családok véleményei ütköztek. Ki szerint túl gyors volt, ki szerint túl sok kockázattal jár, más pedig attól félt, hogy a mindennapokban túl nehéz lesz.\nViktória egyre feszültebb lett.\nEgy este azt mondta:\n– Lehet, hogy nem kellene összeházasodnunk.\nRoland megijedt.\n– Megint megijedtél?\n– Nem. Most először próbálok nem félni."]]}, {"n": 34, "items": [["p", "Ez a mondat mindent megváltoztatott.\nLeültek.\nMegbeszéltek mindent.\nPénzt, munkát, háztartást, családot, önállóságot, utazást, betegséget, öregedést, mindent, amit addig romantikusnak gondoltak, de valójában a közös élet alapja volt.\nA végén Viktória csak ennyit mondott:\n– Most már jobban szeretlek, mint az eljegyzés előtt.\nRoland elmosolyodott.\n– Miért?\n– Mert most már tudom, hogy nem egy álomba szeretek bele. Hanem beléd.\n15. fejezet – Az esküvő napja\nAz esküvő egyszerű volt.\nNem akartak tökéletes fényképeket.\nNem akartak nagy tömeget.\nCsak azokat hívták meg, akik valóban fontosak voltak.\nZsuzsanna is ott volt.\nLaci is.\nA szertartás előtt Laci odalépett Rolandhoz.\n– Vigyázz rá.\nRoland elmosolyodott.\n– Ő is vigyáz rám.\n– Akkor jó.\nAmikor Viktória megérkezett, Roland nem látta a ruháját.\nDe hallotta a lépteit.\nÉrezte, ahogy megfogja a kezét.\nÉs valamiért úgy érezte, hogy életében először nem hiányzik semmi.\nAz eskü után Viktória megszorította az ujjait.\n– Most már tényleg együtt.\n– Eddig nem voltunk?\n– De. Most már hivatalosan is.\nNevettek.\nA vacsoránál újra előkerült a tánc.\nAz a bizonyos régi, ügyetlen tánc.\nMost sem voltak tökéletesek.\nDe már nem számított.\nA zene szólt.\nŐk pedig táncoltak.\n16. fejezet – Amit senki sem lát\nA házasság első éve nem volt mese.\nVoltak jó napok.\nVoltak nehéz napok.\nVolt, hogy Viktória fáradtan ért haza, és nem akart beszélni.\nVolt, hogy Rolandnak volt rossz napja, és türelmetlenebb volt a kelleténél.\nEgyik este azonban Viktória ezt mondta:\n– Tudod, mi a legfurcsább?\n– Mi?\n– Hogy régen azt hittem, a vakságom a legnagyobb veszteségem.\nRoland hallgatott.\n– Ma már nem így gondolom.\n– Hanem?\n– A legnagyobb veszteség az lett volna, ha a vakság miatt nem merem megélni azt, ami utána jött.\nRoland megszorította a kezét.\n– És én?"]]}, {"n": 35, "items": [["p", "– Te nem megmentettél.\n– Hanem?\n– Megtanultad, hogyan legyél mellettem.\nRoland szemében könny gyűlt.\nA történetük nem arról szólt, hogy két látássérült ember megtalálta egymást.\nHanem arról, hogy két ember megtanulta: a másik szabadsága nem veszélyezteti a szeretetet.\n17. fejezet – Újabb út\nÉvek múlva újra elutaztak.\nMost már nem féltek annyira az ismeretlen helyektől.\nA vasútállomáson egy fiatal látássérült lány szólította meg őket.\n– Bocsánat, segítenének? Most utazom először egyedül.\nViktória megfogta a kezét.\n– Persze.\nRoland hallgatta őket.\nA lány rengeteget kérdezett.\nHogyan kell megtalálni a peront?\nHogyan kell segítséget kérni?\nMi van, ha eltéved?\nViktória minden kérdésre válaszolt.\nA vonat indulásakor a lány azt mondta:\n– Maguk régóta csinálják ezt.\nRoland elmosolyodott.\n– Mi is voltunk kezdők.\n– És féltek?\n– Nagyon.\n– Akkor miért indultak el?\nViktória válaszolt:\n– Mert a félelem nem mindig azt jelenti, hogy nem szabad menni. Néha csak azt jelenti, hogy valami fontos felé tartunk.\nA vonat elindult.\nRoland Viktória vállára hajtotta a fejét.\n– Büszke vagyok rád.\n– Én is rád.\n– Magunkra?\n– Arra még inkább.\n18. fejezet – Egy rossz hír\nEgy ősz eleji reggelen Viktória rossz hírt kapott.\nAz édesanyja beteg lett, és kórházba került.\nMinden addigi probléma hirtelen jelentéktelenné vált.\nRoland vele ment.\nA kórházi folyosón Viktória összetört.\n– Félek.\n– Én is.\n– Nem tudom, mi lesz.\n– Én sem.\nViktória ekkor megfogta a kezét.\n– Most ne mondd azt, hogy minden rendben lesz.\nRoland bólintott.\n– Nem fogom.\n– Csak maradj itt.\n– Itt maradok.\nAz orvosok később jó hírt adtak, de a következő hetek így is nehezek voltak.\nViktória rájött, hogy a szeretet nem mindig reménykeltő mondatokból áll.\nNéha abból áll, hogy valaki leül melléd a váróteremben, és nem megy el."]]}, {"n": 36, "items": [["heading", "19. fejezet – Bocsánat\nA családi nehézségek után Roland és Viktória újra egymásra találtak.\nEgyik este Viktória azt mondta:\n– Van valami, amit még sosem mondtam el.\n– Hallgatlak.\n– Sokszor azért voltam dühös rád, mert féltem, hogy ha túlságosan szeretlek, akkor egyszer elveszíthetlek.\nRoland csendben maradt.\n– Ezért taszítottalak el?\n– Igen.\n– Én pedig azért kapaszkodtam beléd, mert attól féltem, hogy ha elengedlek, elveszítelek.\nNevettek.\n– Mindketten ugyanattól féltünk.\n– Csak másképp.\nA beszélgetés után sokáig ültek egymás mellett.\nA szerelemük már nem olyan volt, mint az első hónapokban.\nNem volt mindig izgalmas.\nNem volt mindig könnyű.\nDe mélyebb lett.\nÉs talán ez volt a legnagyobb kalandjuk.\n20. fejezet – A könyv, amely egyszer majd megszületik\nEgy este Roland elővette a régi jegyzeteit.\n– Mit csinálsz? – kérdezte Viktória.\n– Írok.\n– Mit?\n– Rólunk.\nViktória elnevette magát.\n– Rólunk ugyan ki lenne kíváncsi?\n– Talán az, aki most azt hiszi, hogy az élete véget ért.\nViktória elhallgatott.\nRoland folytatta:\n– Ha csak egy ember elolvassa, és azt mondja, hogy holnap felkel és megpróbálja, már megérte.\nViktória megfogta a kezét.\n– Akkor írd meg.\nÉs Roland írni kezdett.\nNem hőstörténetet.\nNem tökéletes szerelmet.\nHanem két ember történetét, akik elveszítettek valamit, amit nem tudtak visszaszerezni, mégis találtak valami mást, amiről korábban nem is tudták, hogy létezik.\n21. fejezet – A régi pad\nÉvekkel később visszatértek ahhoz a tóhoz, ahol Viktória egyszer megkérdezte Rolandot, hogy vajon ugyanígy szeretné-e őt, ha újra látna.\nLeültek ugyanarra a padra.\n– Emlékszel? – kérdezte Viktória.\n– Minden szavára.\n– Akkor mit válaszoltál?\nRoland elmosolyodott.\n– Azt, hogy akkor is szeretnélek.\n– És most?\n– Most már nem kell elképzelnem.\nViktória felnevetett.\n– Miért?"]]}, {"n": 37, "items": [["p", "– Mert most már tudom.\nCsend lett.\nA tó hangja alig hallatszott.\n– Roland?\n– Igen?\n– Ha újra kezdhetnéd, mindent ugyanígy csinálnál?\nRoland sokáig gondolkodott.\n– Nem.\nViktória meglepődött.\n– Nem?\n– Nem. Kevesebbet félnék. Többet kérdeznék. Többször mondanám, hogy szeretlek. És hamarabb hinném el, hogy nem kell tökéletesnek lennem ahhoz, hogy boldog legyek.\nViktória megfogta a kezét.\n– Én is.\n22. fejezet – Laci búcsúja\nLaci később külföldre költözött. Mielőtt elutazott, találkozott velük.\n– Furcsa – mondta. – Régen azt hittem, az életünk mindig ugyanott marad.\n– Én is – felelte Viktória.\nLaci elmosolyodott.\n– Örülök, hogy megtaláltad őt.\n– Én is.\nRoland kezet nyújtott.\n– Vigyázz magadra.\n– Ti is.\nLaci távozása után Viktória csendben maradt.\n– Hiányozni fog.\n– Tudom.\n– Féltékeny voltál rá.\nRoland elnevette magát.\n– Nagyon.\n– Most már?\n– Most már tudom, hogy a múltad nem ellenem van.\nViktória átölelte.\n– Szeretlek.\n– Én is.\nAz életükből nem mindenki maradt örökre.\nDe mindenki hagyott bennük valamit.\n23. fejezet – A legnagyobb kaland\nEgy nyári reggelen újabb utazásra indultak. Most már egy kis csoporttal, amelyet ők szerveztek.\nFiatalok, idősebbek, kezdők és rutinosabbak együtt.\nAz első napon egy turista eltévedt.\nA második napon valaki leejtette a telefonját.\nA harmadik napon eleredt az eső.\nMindenki nevetett.\n– Ez lenne a tökéletes kirándulás? – kérdezte valaki.\nRoland felnevetett.\n– Nem. Ez lenne az igazi.\nEste Viktória azt mondta:\n– Emlékszel, amikor azt hittük, hogy a világ bezárult előttünk?\n– Igen.\n– Tévedtünk.\nRoland a távolba figyelt.\n– A világ nem zárult be.\n– Csak más ajtókat kellett megtalálnunk.\nÉs talán ez volt az egész történetük legfontosabb mondata.\n24. fejezet – A család\nA családi összejövetelek idővel új jelentést kaptak."]]}, {"n": 38, "items": [["p", "Már nem arról szóltak, hogy mindenki megkérdezi, szükségük van-e segítségre.\nHanem arról, hogy egyszerűen együtt vannak.\nNevettek.\nFőztek.\nVitatkoztak.\nMegint nevettek.\nRoland édesanyja egyszer megjegyezte:\n– Fiam, amikor megismertelek benneteket, nem gondoltam volna, hogy idáig jutottok.\nRoland mosolygott.\n– Mi sem.\nViktória hozzátette:\n– De az biztos, hogy egyszer sem volt unalmas.\nMindenki nevetett.\nA család nem mindig értett egyet.\nDe megtanulták, hogy a szeretet nem azonos a tökéletes egyetértéssel.\n25. fejezet – A csend\nEgyik este áramszünet lett.\nA lakás teljesen elcsendesedett.\nRoland és Viktória az ablak mellett ültek.\n– Tudod, mások most biztosan panaszkodnak, hogy nem látnak semmit – mondta Viktória.\nRoland elnevette magát.\n– Mi pedig?\n– Mi legalább gyakorlottak vagyunk.\nNevettek.\nAztán hosszú csend következett.\nNem kellett beszélni.\nA csendben ott volt minden.\nAz első találkozás.\nA bot.\nA kórház.\nA műtét.\nA vita.\nA szakítás.\nA kibékülés.\nA tenger.\nA gyűrű.\nAz esküvő.\nA család.\nMinden.\nRoland megfogta Viktória kezét.\n– Ha egyszer valaki megkérdezné, mi volt a legszebb pillanatunk, mit mondanál?\nViktória gondolkodott.\n– Ezt.\n– Ezt?\n– Igen. Mert most nincs szükségünk semmire.\n26. fejezet – Amit továbbadunk\nAz évek során egyre több ember kereste meg őket tanácsért.\nRoland mindig azt mondta:\n– Nem tudom megmondani, neked mi lesz a jó.\nViktória hozzátette:\n– De elmondhatjuk, nekünk mi segített.\nNem akartak példaképek lenni.\nNem akartak tökéletesnek látszani.\nCsak őszinték akartak lenni.\nElmondták a félelmeiket is.\nA rossz napokat.\nA vitákat.\nA hibákat.\nMert tudták, hogy az újrakezdés nem attól hiteles, hogy nincs benne fájdalom.\nHanem attól, hogy a fájdalom ellenére van benne következő nap.\n27. fejezet – Az utolsó utazás?"]]}, {"n": 39, "items": [["p", "Egy ősz eleji reggelen Viktória megkérdezte:\n– Hová menjünk most?\nRoland gondolkodott.\n– Nem tudom.\n– Akkor induljunk el.\n– Merre?\n– Bármerre.\nFelnevettek.\nA pályaudvaron felszálltak egy olyan vonatra, amelynek az úticélját egyikük sem ismerte igazán.\nNem volt előre lefoglalt szállás.\nNem volt tökéletes terv.\nCsak két hátizsák és két fehér bot.\nA vonat elindult.\nRoland az ablak felé fordult.\nNem látta a tájat.\nDe hallotta a kerekek ritmusát.\nÉrezte Viktória kezét.\nÉs tudta, hogy ez elég.\n– Hová megyünk? – kérdezte.\nViktória elmosolyodott.\n– Majd megtudjuk.\n28. fejezet – Az út végén\nA vonat órákon át haladt.\nBeszélgettek, aludtak, nevettek.\nAmikor végül leszálltak, egy kisváros fogadta őket.\nIsmeretlen volt.\nPont ezért szerették.\nEgy idős férfi segített nekik megtalálni a szállásukat.\n– Maguk ketten egyedül utaznak? – kérdezte.\n– Igen – felelte Viktória.\n– Nem félnek?\nRoland elmosolyodott.\n– De.\nAz idős férfi meglepődött.\n– Akkor miért jöttek?\nViktória válaszolt:\n– Mert nem akarjuk, hogy a félelem döntsön helyettünk.\nA férfi csendben maradt.\nAztán csak annyit mondott:\n– Akkor jó utat.\nRoland és Viktória elindultak.\nA lépteik egyenletesen koppantak az úton.\nKetten.\nEgyütt.\nDe már nem egymásra támaszkodva.\nHanem egymás mellett.\n29. fejezet – A szív szemével\nAmikor hazatértek, Roland befejezte a könyvet.\nAz utolsó fejezetet nem a kórházzal, nem a tengerrel és nem az esküvővel kezdte.\nHanem azzal a nappal, amikor egy idegen nő megszólította az utcán.\nAznap még nem tudta, milyen történet vár rá.\nNem tudta, hogy megismer egy lányt.\nNem tudta, hogy beleszeret.\nNem tudta, hogy lesznek viták, csalódások, félelmek és újrakezdések.\nNem tudta, hogy egyszer majd valaki megkérdezi tőle, mit jelent igazán látni.\nMost már tudta.\nA látás nem mindig a szem dolga."]]}, {"n": 40, "items": [["p", "Van, amit a füllel érzünk.\nVan, amit a kézzel.\nVan, amit a szívvel.\nÉs vannak emberek, akiket akkor látunk meg igazán, amikor már net.\nEgy újabb ok arra, hogy higgyenek.\nRoland és Viktória felálltak a padról.\nA fehér botok halkan koppantak a járdán.\nEgyikük sem tudta pontosan, merre visz a következő út.\nDe már nem is kellett tudniuk.\nElindultak.\nEgyütt.\nA szív szemével.\nUtószó\nEz a történet nem a tökéletes életről szól.\nHanem arról, hogy a veszteségek után is lehet új utat találni, a szerelem pedig nem attól valódi, hogy soha nincs benne fájdalom, hanem attól, hogy két ember újra és újra képes egymást választani.\nRoland és Viktória útja itt lezárul, de az ő történetükben talán éppen az a legfontosabb, hogy nincs valódi végpont. Csak újabb utak, újabb találkozások és újabb lehetőségek."]]}];
let index=0, auto=false, speaking=false;
const book=document.getElementById('book');
function render(){
  book.innerHTML='';
  pages.forEach((pg,i)=>{
    const d=document.createElement('article');
    d.className='page'+(i===0?' cover':'')+(i===index?' active':'');
    d.setAttribute('aria-hidden',i===index?'false':'true');
    let s='';
    if(i===0){
      s += '<h1>A szív szemével</h1><h2>A teljes könyv</h2>';
      s += '<p>Lapozható, hangosan felolvasható digitális kiadás</p>';
    }
    pg.items.forEach(([t,x])=>{
      const safe=x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      s += t==='heading'?'<h2>'+safe+'</h2>':'<p>'+safe+'</p>';
    });
    s += '<div class="num">'+(i+1)+' / '+pages.length+'</div>';
    d.innerHTML=s; book.appendChild(d);
  });
  document.getElementById('status').textContent=(index+1)+' / '+pages.length+' oldal';
}
function show(i){
  stopSpeak(); index=Math.max(0,Math.min(pages.length-1,i)); render();
}
function nextPage(){show(index+1)}
function prevPage(){show(index-1)}
function pageText(){
  const pg=pages[index];
  return pg.items.map(x=>x[1]).join('\n');
}
function speakPage(){
  if(!('speechSynthesis' in window)){alert('A böngésző nem támogatja a hangos felolvasást.');return}
  stopSpeak();
  const u=new SpeechSynthesisUtterance(pageText());
  u.lang='hu-HU'; u.rate=.92; u.pitch=1;
  u.onstart=()=>{speaking=true;document.getElementById('status').textContent='Felolvasás…'};
  u.onend=()=>{speaking=false;if(auto && index<pages.length-1){index++;render();setTimeout(speakPage,300)}else{document.getElementById('status').textContent=(index+1)+' / '+pages.length+' oldal'}};
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false}
function toggleAuto(){auto=!auto;document.getElementById('autoBtn').textContent=auto?'⏸ Automatikus leállítása':'▶ Automatikus'}
let sx=null;
book.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX},{passive:true});
book.addEventListener('touchend',e=>{if(sx===null)return;let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>45){dx<0?nextPage():prevPage()}sx=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage();if(e.key===' '){e.preventDefault();speakPage()}});
render();
</script>
